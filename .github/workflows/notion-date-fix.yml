name: Notion 重复任务日期自动修正

# ★★★ 每天跑三次（北京时间 01:10 / 03:10 / 05:10）★★★ ★
#   GitHub Actions 的 cron 用 UTC：北京时间 X:10 = UTC 前一天 (X-8):10
#   ★ 为什么三次 ★
#   ① Notion 的重复任务在【0:00-3:00】分散生成（每条隔十几分钟）
#   ② GitHub 的 schedule【会延迟】（实测计划 03:10 → 实际 03:57，晚了 47 分钟）
#   ③ 一次跑可能落在生成之后、也可能落在生成中间 → 漏掉后面生成的 ★
#   → 三次兜底：01:10 修正早批、03:10 修正中批、05:10 收尾 ★
#   ★ 脚本本身幂等 → 多跑几次不会重复改 ★
on:
  schedule:
    - cron: "10 17 * * *"   # 北京时间 01:10
    - cron: "10 19 * * *"   # 北京时间 03:10
    - cron: "10 21 * * *"   # 北京时间 05:10
  # 也能在网页上手动点一下跑
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 拉取代码
        uses: actions/checkout@v5

      - name: 设定 Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: 修正 Notion 重复任务日期
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node notion-date-fix.js --执行

      - name: 提交自学习到的任务名
        # 脚本发现新的重复任务名时会写回配置，这里提交回仓库
        # （失败不影响主流程，忽略即可）
        continue-on-error: true
        run: |
          if git diff --quiet -- notion-date-fix.config.json; then
            echo "配置无变化，无需提交"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add notion-date-fix.config.json
            git commit -m "chore: 自动记录新发现的重复任务名"
            git push
          fi
